<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFT RUSH | Play the Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d20;color:white;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;background:#111b39;border-bottom:2px solid #00e5ff}
h1{font-size:38px;margin:5px;color:#00e5ff;letter-spacing:3px}
.tag{color:#ffcb42;letter-spacing:3px;font-size:12px}
main{max-width:850px;margin:auto;padding:18px;text-align:center}
.card{background:#152040;border:1px solid #34476c;border-radius:20px;padding:22px;margin:15px 0}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.world{border:2px solid #34476c;border-radius:18px;padding:22px 8px;cursor:pointer;background:#1c2c50;color:white;font-size:16px}
.world:hover,.world.selected{border-color:#00e5ff;background:#264570}
.emoji{font-size:48px;display:block;margin-bottom:12px}
button{font-family:inherit}
.action{background:linear-gradient(90deg,#00d5ff,#5575ff);border:0;border-radius:12px;padding:15px 25px;color:#071025;font-weight:bold;font-size:18px;cursor:pointer;margin:8px}
.action:disabled{opacity:.45}
.secondary{background:#263b65;color:white}
.hidden{display:none}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:390px;margin:20px auto}
.tile{aspect-ratio:1;border-radius:12px;border:2px solid #3d5a83;background:#203456;cursor:pointer}
.tile.flash{background:#ffe35b;box-shadow:0 0 22px #ffe35b}
.tile.correct{background:#16d7a2}
.tile.wrong{background:#ff5674}
#status{min-height:55px;font-size:18px;line-height:1.5}
.stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:#8feeff}
.small{font-size:13px;color:#a9b8d4}
@media(max-width:450px){h1{font-size:30px}.world{padding:18px 5px}}
</style>
</head>
<body>

<header>
<h1>⚡ RIFT RUSH</h1>
<div class="tag">YOUR WORLD. YOUR RULES.</div>
</header>

<main>
<div class="stats">
<span>⭐ XP: <b id="xp">0</b></span>
<span>🏆 Wins: <b id="wins">0</b></span>
<span>🔥 Level: <b id="level">1</b></span>
</div>

<section id="home">
<div class="card">
<h2>CHOOSE YOUR WORLD</h2>
<p>Four worlds. Endless challenges. One legend.</p>
<div class="worlds">
<button class="world selected" onclick="choose(0,this)">
<span class="emoji">🚵</span>
<b>MTB WILDLANDS</b><br><small>Ride the impossible</small>
</button>
<button class="world" onclick="choose(1,this)">
<span class="emoji">🚀</span>
<b>GALAXY RIFT</b><br><small>Escape the unknown</small>
</button>
<button class="world" onclick="choose(2,this)">
<span class="emoji">✈️</span>
<b>SKY STRIKE</b><br><small>Rule the skies</small>
</button>
<button class="world" onclick="choose(3,this)">
<span class="emoji">🤖</span>
<b>BOT ARENA</b><br><small>Outsmart the machines</small>
</button>
</div>
<br>
<button class="action" onclick="start()">⚡ START MISSION</button>
</div>
<div class="card">
<h3>🎮 GAME DIRECTOR EDITION</h3>
<p>Explore the worlds, complete missions and unlock higher levels.</p>
<p class="small">First playable prototype • Solo missions</p>
</div>
</section>

<section id="game" class="hidden">
<div class="card">
<h2 id="missionTitle">MISSION</h2>
<p id="story"></p>
<div id="status"></div>
<div id="grid"></div>
<button class="action" id="launch" onclick="showPattern()">▶ SCAN ROUTE</button>
<button class="action secondary" onclick="back()">↩ WORLD SELECT</button>
</div>
</section>
</main>

<script>
const names=["MTB WILDLANDS","GALAXY RIFT","SKY STRIKE","BOT ARENA"];
const stories=[
"🚵 Scan the mountain trail. Remember the safe checkpoints before the fog arrives!",
"🚀 Scan the star portals. Memorize the jump sequence to escape the asteroid field!",
"✈️ Your navigation system is offline. Memorize the flight path and guide your jet!",
"🤖 The security bots are approaching. Memorize the energy nodes to disable the shield!"
];

let world=0,sequence=[],answers=[],busy=false,phase="ready";
let xp=Number(localStorage.getItem("riftXP")||0);
let wins=Number(localStorage.getItem("riftWins")||0);
let level=1;

function update(){
level=Math.min(8,1+Math.floor(wins/3));
document.getElementById("xp").textContent=xp;
document.getElementById("wins").textContent=wins;
document.getElementById("level").textContent=level;
localStorage.setItem("riftXP",xp);
localStorage.setItem("riftWins",wins);
}
update();

function choose(n,el){
world=n;
document.querySelectorAll(".world").forEach(x=>x.classList.remove("selected"));
el.classList.add("selected");
}

function start(){
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
document.getElementById("missionTitle").textContent=names[world]+" — LEVEL "+level;
document.getElementById("story").textContent=stories[world];
document.getElementById("status").textContent="Ready for your mission?";
document.getElementById("launch").textContent="▶ SCAN ROUTE";
document.getElementById("launch").disabled=false;
document.getElementById("launch").classList.remove("hidden");
phase="ready";
draw();
}

function draw(){
const grid=document.getElementById("grid");
grid.innerHTML="";
for(let i=0;i<16;i++){
let b=document.createElement("button");
b.className="tile";
b.setAttribute("aria-label","Checkpoint "+(i+1));
b.onclick=()=>tap(i,b);
grid.appendChild(b);
}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function showPattern(){
if(busy)return;
busy=true;
phase="watch";
answers=[];
sequence=[];
draw();
document.getElementById("launch").disabled=true;
const count=Math.min(7,2+level);
let last=-1;
for(let i=0;i<count;i++){
let n;
do{n=Math.floor(Math.random()*16)}while(n===last);
sequence.push(n);
last=n;
}
document.getElementById("status").textContent="👀 Watch carefully. Remember the route!";
await sleep(650);
const tiles=document.querySelectorAll(".tile");
for(let n of sequence){
tiles[n].classList.add("flash");
await sleep(Math.max(380,850-level*55));
tiles[n].classList.remove("flash");
await sleep(260);
}
phase="answer";
busy=false;
document.getElementById("status").textContent="⚡ Your turn! Tap the checkpoints in the SAME order.";
}

async function tap(n,b){
if(busy||phase!=="answer")return;
let expected=sequence[answers.length];
if(n!==expected){
phase="finished";
b.classList.add("wrong");
document.getElementById("status").textContent="💥 Mission failed! Retry the route!";
document.getElementById("launch").textContent="🔄 RETRY MISSION";
document.getElementById("launch").disabled=false;
return;
}
answers.push(n);
b.classList.add("correct");
await sleep(180);
b.classList.remove("correct");
if(answers.length===sequence.length){
phase="finished";
wins++;
xp+=100+level*25;
update();
document.getElementById("status").textContent="🏆 MISSION COMPLETE! +"+(100+level*25)+" XP!";
document.getElementById("launch").textContent="🚀 NEXT MISSION";
document.getElementById("launch").disabled=false;
document.getElementById("missionTitle").textContent=names[world]+" — LEVEL "+level;
}
}

function back(){
if(busy)return;
phase="ready";
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}
</script>
</body>
</html>
